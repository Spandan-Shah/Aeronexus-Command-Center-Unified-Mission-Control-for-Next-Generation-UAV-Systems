; ============================================================
; Aeronexus / GoblinWisp
; Aircraft ESP32-S3 ESP-NOW Node
; ============================================================

[platformio]
default_envs = goblinwisp-aircraft

; IMPORTANT:
; Keep build artifacts outside the repository path because
; the repository folder contains a Unicode em dash character.
; The Windows Xtensa linker can fail when creating firmware.map
; inside non-ASCII paths.
build_dir = M:/PlatformIO/build/goblinwisp_aircraft


[env:goblinwisp-aircraft]

; ------------------------------------------------------------
; Platform / Framework
; ------------------------------------------------------------

platform = platformio/espressif32@8.0.0
framework = arduino
board = esp32-s3-devkitc-1


; ------------------------------------------------------------
; CPU
; ------------------------------------------------------------

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L


; ------------------------------------------------------------
; Flash
;
; Current GoblinWisp ESP32-S3 hardware baseline:
; 16 MB flash
; ------------------------------------------------------------

board_build.flash_mode = qio
board_build.flash_size = 16MB

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

board_build.partitions = default_16MB.csv


; ------------------------------------------------------------
; PSRAM
;
; Current GoblinWisp ESP32-S3 hardware baseline:
; 8 MB OPI PSRAM
; ------------------------------------------------------------

board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi


; ------------------------------------------------------------
; Host Debug Serial
;
; Use UART0 / Serial0 through the board's USB-to-UART bridge.
;
; Native USB CDC is deliberately disabled so Arduino "Serial"
; maps to UART0, matching the configuration proven on the
; Ground GoblinWisp ESP32-S3.
;
; The Aircraft COM port is NOT hardcoded here because Windows
; may assign a different port from the Ground board's COM7.
; ------------------------------------------------------------

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0


; ------------------------------------------------------------
; Serial Monitor
; ------------------------------------------------------------

monitor_speed = 115200

monitor_filters =
    time
    esp32_exception_decoder


; ------------------------------------------------------------
; Upload
;
; Upload port intentionally omitted.
; We will discover the real Aircraft ESP32-S3 COM port before
; the first physical flash.
; ------------------------------------------------------------

upload_protocol = esptool
upload_speed = 921600


; ------------------------------------------------------------
; Build
; ------------------------------------------------------------

build_type = release


; ------------------------------------------------------------
; Libraries
; ------------------------------------------------------------

lib_deps =
    bblanchon/ArduinoJson@^7.0.0