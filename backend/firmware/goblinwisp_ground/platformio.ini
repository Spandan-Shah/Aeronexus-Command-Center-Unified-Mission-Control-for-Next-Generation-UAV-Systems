; ============================================================
; Aeronexus / GoblinWisp
; Ground ESP32-S3 ESP-NOW Bridge
; ============================================================

[platformio]
default_envs = goblinwisp-ground

; IMPORTANT:
; Keep build artifacts outside the repository path because
; the repo folder contains a Unicode em dash character.
; The Windows Xtensa linker can fail when creating firmware.map
; inside non-ASCII paths.
build_dir = M:/PlatformIO/build/goblinwisp_ground


[env:goblinwisp-ground]

; ------------------------------------------------------------
; Platform / Framework
; ------------------------------------------------------------

platform = platformio/espressif32@8.0.0
framework = arduino
board = esp32-s3-devkitc-1


; ------------------------------------------------------------
; CPU
; ------------------------------------------------------------

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L


; ------------------------------------------------------------
; Flash
; Detected hardware: 16 MB
; ------------------------------------------------------------

board_build.flash_mode = qio
board_build.flash_size = 16MB

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

board_build.partitions = default_16MB.csv


; ------------------------------------------------------------
; PSRAM
; Detected hardware: 8 MB OPI PSRAM
; ------------------------------------------------------------

board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi


; ------------------------------------------------------------
; Host Serial Interface
;
; Physical board connection currently exposed to Windows:
;
;   Windows PC
;       |
;       | COM7
;       |
;      CH340
;       |
;      UART0
;       |
;   ESP32-S3
;
; USB CDC on boot is therefore disabled so Arduino "Serial"
; maps to UART0 / Serial0 rather than native USB CDC.
; ------------------------------------------------------------

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0


; ------------------------------------------------------------
; Serial Monitor
; ------------------------------------------------------------

monitor_speed = 115200
monitor_port = COM7

monitor_filters =
    time
    esp32_exception_decoder


; ------------------------------------------------------------
; Upload
; ------------------------------------------------------------

upload_protocol = esptool
upload_port = COM7
upload_speed = 921600


; ------------------------------------------------------------
; Build
; ------------------------------------------------------------

build_type = release


; ------------------------------------------------------------
; Libraries
; ------------------------------------------------------------

lib_deps =
    bblanchon/ArduinoJson@^7.0.0