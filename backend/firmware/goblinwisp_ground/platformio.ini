; ============================================================
; Aeronexus / GoblinWisp
; Ground ESP32-S3 ESP-NOW Bridge
; ============================================================
;
; Physical architecture:
;
;   MissionNexus Windows Host
;           |
;           | Native USB Serial/JTAG
;           |
;           v
;   Ground ESP32-S3
;           |
;           | ESP-NOW
;           |
;           v
;   Aircraft ESP32-S3
;
; Target detected with esptool:
;
;   MCU:        ESP32-S3
;   Flash:      16 MB
;   PSRAM:      8 MB
;   USB mode:   USB-Serial/JTAG
;
; ============================================================


[platformio]
default_envs = goblinwisp-ground


[env:goblinwisp-ground]

; ------------------------------------------------------------
; Platform / Framework
; ------------------------------------------------------------

platform = platformio/espressif32@8.0.0
framework = arduino
board = esp32-s3-devkitc-1


; ------------------------------------------------------------
; CPU
; ------------------------------------------------------------

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L


; ------------------------------------------------------------
; Flash
;
; Physical device detected:
;   16 MB
; ------------------------------------------------------------

board_build.flash_mode = qio
board_build.flash_size = 16MB

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

board_build.partitions = default_16MB.csv


; ------------------------------------------------------------
; PSRAM
;
; Current device:
;   8 MB PSRAM
;
; ESP32-S3 N16R8-style configuration:
;   QIO Flash
;   OPI PSRAM
; ------------------------------------------------------------

board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi


; ------------------------------------------------------------
; Native USB Serial/JTAG
;
; This is CRITICAL for the MissionNexus bridge.
;
; Serial must be available bidirectionally through the
; ESP32-S3 native USB interface.
; ------------------------------------------------------------

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3


; ------------------------------------------------------------
; Serial Monitor
; ------------------------------------------------------------

monitor_speed = 115200
monitor_port = COM6

monitor_filters =
    time
    esp32_exception_decoder


; ------------------------------------------------------------
; Upload
;
; Current Ground ESP32-S3:
;   COM6
; ------------------------------------------------------------

upload_protocol = esptool
upload_port = COM6

upload_speed = 921600


; ------------------------------------------------------------
; Build
; ------------------------------------------------------------

build_type = release


; ------------------------------------------------------------
; Libraries
;
; ArduinoJson will be used for the GW-ESPNOW-BRIDGE
; newline-delimited JSON protocol between MissionNexus
; and the Ground ESP32-S3.
; ------------------------------------------------------------

lib_deps =
    bblanchon/ArduinoJson@^7.0.0