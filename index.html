<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#05060d"
    />

    <meta
      name="color-scheme"
      content="dark"
    />

    <meta
      name="description"
      content="MissionNexus by Aeronexus — autonomous mission command, UAV operations, telemetry, intelligence and secure mission management."
    />

    <meta
      name="application-name"
      content="MissionNexus"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="MissionNexus"
    />

    <!-- =====================================================
         Aeronexus Product Typography
         Matches GeoFusion family styling
         ===================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- =====================================================
         Aeronexus Transparent Favicon

         File expected at:
         public/aeronexus-favicon.svg

         The SVG itself must NOT contain a background rect.
         ===================================================== -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/aeronexus-favicon.svg?v=6"
    />

    <link
      rel="shortcut icon"
      type="image/svg+xml"
      href="/aeronexus-favicon.png?v=6"
    />

    <!-- =====================================================
         Browser Title
         ===================================================== -->

    <title>MissionNexus | Aeronexus</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
